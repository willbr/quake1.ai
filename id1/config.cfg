// Movement
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "SHIFT" "+speed"
bind "CTRL" "+movedown"
bind "e" "+moveup"

// Combat
bind "MOUSE1" "+attack"
bind "MOUSE2" "+jump"
bind "MOUSE3" "impulse 10"
bind "MWHEELUP" "impulse 10"
bind "MWHEELDOWN" "impulse 12"

// Weapons
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"

// UI
bind "TAB" "+showscores"
bind "ESCAPE" "togglemenu"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
bind "t" "messagemode"
bind "F2" "menu_save"
bind "F3" "menu_load"
bind "F6" "echo Quicksaving...; wait; save quick"
bind "F9" "echo Quickloading...; wait; load quick"
bind "F10" "quit"
bind "F12" "screenshot"
bind "PAUSE" "pause"

// Mouse
sensitivity "5"
m_yaw "0.022"
m_pitch "0.022"
m_side "0.8"
m_forward "1"
lookspring "0"
lookstrafe "0"

// Speed — 400 = always at run speed without holding shift
cl_forwardspeed "400"
cl_backspeed "400"
cl_sidespeed "400"
cl_movespeedkey "2"

// Display
viewsize "100"
crosshair "1"
gamma "1.0"

// Player
_cl_color "0"
_cl_name "player"
